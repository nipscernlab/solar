name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A push that lands while the previous one is still running cancels it: only the tip of a
# branch is worth knowing about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rustup reads rust-toolchain.toml, so the toolchain here is byte for byte the one
      # a laptop uses. No third-party action decides the compiler.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)

      # The same remap flags xtask computes, exported once so that every step of this job
      # builds identically and nothing is compiled twice over a flag change. The strings
      # must match xtask/src/flags.rs to the byte.
      - name: Compute the remap flags (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          flags="--remap-path-prefix=$HOME=/users/anon --remap-path-prefix=$PWD=/solar"
          if [ "$(uname)" = "Darwin" ]; then
            flags="$flags -Clink-arg=-Wl,-oso_prefix,$HOME/"
          fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Compute the remap flags (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $flags = "--remap-path-prefix=$env:USERPROFILE=/users/anon --remap-path-prefix=$env:GITHUB_WORKSPACE=/solar"
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=$flags"

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version

      # Prebuilt binaries for the checkers cargo would otherwise compile from source.
      - name: Install the checkers and the test runner
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: typos-cli,taplo-cli,cargo-nextest,cargo-deny

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: TOML formatting
        run: taplo fmt --check

      - name: Spelling
        run: typos

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests; nothing else does either, so they are their own step.
      - name: Doctests
        run: cargo test --doc --workspace --locked

      - name: The manifest is not stale
        run: cargo run --package xtask --locked --quiet -- manifest --check

      # What a caller written against the base branch would notice, and whether the
      # version of each API answers for it. Only on a pull request, where there is a base.
      - name: The manifest stays compatible
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          cargo run --package xtask --locked --quiet -- compat "origin/${{ github.base_ref }}"

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: The release binary answers
        shell: bash
        run: |
          ./target/release/solar call solar.ping '{"message":"ci"}'
          ./target/release/solar version
          ./target/release/solar list

      # Every shell-tagged block of the Markdown runs in the shell it is written for:
      # bash everywhere, powershell and cmd where they exist, which is the Windows job.
      - name: The documentation runs
        run: cargo run --package xtask --locked --quiet -- doc-run

      # The binary that would be shipped from this commit names no user and no machine.
      - name: The release binary embeds no local path
        run: cargo run --package xtask --locked --quiet -- leak-check

      # Advisories, licences, sources and duplicates. One system is enough for a check
      # about the dependency tree, which is the same everywhere.
      - name: Supply chain
        if: runner.os == 'Linux'
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
      - name: Install the coverage tool and the test runner
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The floor lives in xtask/src/coverage.rs, with the date it was measured. It only
      # ever goes up.
      - name: Coverage of the shipped crates
        run: cargo run --package xtask --locked --quiet -- coverage --report

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: warn

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
      - name: Build the API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
