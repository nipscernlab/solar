name: scheduled

# The early warnings: what breaks on a compiler this repository has not pinned yet, and
# whether the declared minimum still builds. Neither belongs in the loop of every push.

on:
  schedule:
    # Mondays at 06:00 UTC, before the working day in Brazil and in Geneva.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable:
    name: latest stable rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest stable, ignoring the pin
        run: |
          rustup toolchain install stable --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
      - name: Report the toolchain
        run: rustc --version
      - name: Lints on the next compiler
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests on the next compiler
        run: cargo test --workspace --locked

  minimum-supported:
    name: minimum supported rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the rust-version of Cargo.toml
        run: |
          minimum="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "the declared minimum is ${minimum}"
          rustup toolchain install "${minimum}"
          echo "RUSTUP_TOOLCHAIN=${minimum}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
      - name: Report the toolchain
        run: rustc --version
      - name: The minimum builds and tests
        run: cargo test --workspace --locked

  fuzz:
    name: fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer needs nightly, which is why this is not in the loop of every push.
      - name: Install nightly
        run: |
          rustup toolchain install nightly --profile minimal
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz

      # Three minutes per target, from the corpus in the repository. Long enough to catch
      # what a change broke, short enough to run every week without anyone minding.
      #
      # The target is named because the prebuilt cargo-fuzz defaults to the triple it was
      # itself built for, musl, whose standard library the runner does not carry.
      - name: Fuzz the envelope parser
        run: cargo fuzz run --target x86_64-unknown-linux-gnu envelope -- -max_total_time=180 -timeout=10
      - name: Fuzz parameter decoding
        run: cargo fuzz run --target x86_64-unknown-linux-gnu parameters -- -max_total_time=180 -timeout=10
      - name: Fuzz the session loop
        run: cargo fuzz run --target x86_64-unknown-linux-gnu session -- -max_total_time=180 -timeout=10
      - name: Fuzz batches
        run: cargo fuzz run --target x86_64-unknown-linux-gnu batch -- -max_total_time=180 -timeout=10

      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore

  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    # The full run mutates every line of the two library crates and runs the whole
    # workspace suite for each one, which is long. Weekly is the right cadence;
    # `cargo xtask mutants -- --in-diff origin/main` is the one to run before opening a
    # pull request. Three hours rather than ninety minutes because the workspace suite
    # per mutant is several times the cost of one crate's, and a job that is killed
    # halfway measures nothing at all. What it really takes here is not known yet: the
    # first run under this setting is the measurement.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.8.1)
      - name: Install the mutation tool and the test runner
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-mutants,cargo-nextest

      # Four jobs, because a GitHub runner has four processors, and every mutant now runs
      # the whole workspace suite rather than one crate's.
      - name: Mutate the shipped crates
        run: cargo run --package xtask --locked --quiet -- mutants --jobs 4

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants
          path: target/mutants/
          if-no-files-found: warn
