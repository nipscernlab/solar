[workspace]
resolver = "3"
members = ["crates/solar-core", "crates/solar-apis", "crates/solar-cli", "xtask"]
# The fuzzing targets need nightly and libfuzzer, and keep a lockfile of their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-NIPS-CERN-1.1"
authors = ["NIPS-CERN <chrysthofer.afonso@cern.ch>"]
repository = "https://github.com/nipscernlab/solar"
homepage = "https://nipscern.com"
publish = false

[workspace.dependencies]
solar-core = { path = "crates/solar-core", version = "0.1.0" }
solar-apis = { path = "crates/solar-apis", version = "0.1.0" }

clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
insta = { version = "1.48", features = ["json", "redactions"] }
jsonschema = "0.58"
proptest = "1.11"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"

# Lints are shared by every crate in the workspace. CI runs clippy with `-D warnings`,
# so everything below that is a warning is effectively an error there as well.
[workspace.lints.rust]
# Denied rather than forbidden, so that one documented function can call RtlGetVersion.
# `forbid` cannot be lifted at all, and the only alternative to that call is starting a
# program, which no API in solar/1 does. Every other crate keeps it at deny with no
# exception, and `grep -rn "allow(unsafe_code)" crates/` finds the whole of it.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# The pedantic group is on as warnings, and CI turns warnings into errors. What the
# group gets wrong for this repository is allowed here, each with its reason, so that a
# lint is never silenced at the place it fires.
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block explains itself, and every `allow` says why.
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
doc_markdown = "warn"

# `panic = "unwind"` is mandatory: dispatch turns a handler panic into an INTERNAL
# error with `std::panic::catch_unwind`, which does nothing under `panic = "abort"`.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = 3
incremental = false
# File and line survive into a crash report; full debug info would triple the binary.
debug = "line-tables-only"
