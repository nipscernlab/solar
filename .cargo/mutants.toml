# Mutation testing: coverage says which lines ran, this says whether anything checked
# what they did. `cargo xtask mutants` runs it; a weekly job runs it in full.
#
# Only the crates that ship are mutated. xtask is the harness, and a surviving mutant in
# a developer tool is not the same kind of news as one in the protocol.

examine_globs = ["crates/solar-core/src/**/*.rs", "crates/solar-apis/src/**/*.rs"]

exclude_globs = [
  # The template strings of the generator are data, not logic.
  "xtask/**",
]

exclude_re = [
  # A hand written Display or Debug that prints a different string is a mutant nothing
  # should fail for: what a value prints is not a promise of the contract, and what is
  # promised, the wire and the screen, is pinned by snapshots rather than by these bodies.
  #
  # The pattern names the shape cargo-mutants really prints, which is
  # `<impl std::fmt::Display for Status>::fmt`. It read `impl Display for .*::fmt`
  # until 27 September 2026, matched nothing, and the exclusion silently did not apply:
  # found by reading a run instead of trusting it, for the second time.
  "<impl .*(Display|Debug) for .*>::fmt",

  # `line.is_empty() || line.starts_with('#')` in parse_os_release is a fast path, not a
  # behaviour: with `&&` nothing is skipped, an empty line then reaches `split_once('=')`
  # and is dropped for having no `=`, and a comment line becomes a key beginning with `#`
  # that matches none of the six keys. The output is the same for every input, which is
  # what an equivalent mutant is. The guard stays because it says what the loop means.
  'replace \|\| with && in parse_os_release',
]

# The whole workspace judges every mutant, not only the crate the mutant is in.
#
# cargo-mutants runs `--package=<the mutated crate>` by default, which is faster and
# answers a different question: it asks whether the crate's own tests notice, when what
# SOLAR promises is that the suite notices. A line of `solar-core` checked by a
# `solar-cli` test is a checked line, and with the default it read as a survivor. Found
# on 27 September 2026 by mutating `logging::log` by hand and watching two command line
# tests fail, after the run had reported it as surviving.
test_workspace = true

# nextest, so a mutant that hangs is killed by the same timeout the suite uses.
test_tool = "nextest"

# A mutant that makes a test hang is a caught mutant, not a wait of several minutes.
timeout_multiplier = 3.0
minimum_test_timeout = 30
